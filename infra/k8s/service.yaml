apiVersion: v1
kind: Service
metadata:
  name: dealfinder-app
  namespace: dealfinder
  labels:
    app.kubernetes.io/name: dealfinder
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dealfinder
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
