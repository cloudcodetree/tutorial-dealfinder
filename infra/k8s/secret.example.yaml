# TEMPLATE ONLY — placeholder values, no real secrets. Copy to `secret.yaml`
# (gitignored), fill in your values, and apply it separately from the rest of
# the stack. Do NOT commit the filled-in file.
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with your real values
#   kubectl apply -f secret.yaml
#
# Prefer a real secrets manager in production (External Secrets Operator +
# AWS Secrets Manager / SOPS / Sealed Secrets) over a plaintext manifest — see
# the README. `stringData` lets you write plain values; Kubernetes base64-encodes
# them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: dealfinder-secrets
  namespace: dealfinder
  labels:
    app.kubernetes.io/name: dealfinder
type: Opaque
stringData:
  # Managed Postgres (pgvector). Point at your external DB — Supabase pooler,
  # Amazon RDS, Neon, etc. We do NOT run Postgres in-cluster (see README).
  DATABASE_URL: "postgresql://USER:PASSWORD@your-managed-pg-host:5432/dealfinder"

  # Supabase Auth — the project's JWT secret used to verify session tokens
  # (Project Settings → API → JWT Secret). Backs dealfinder/auth.py.
  SUPABASE_JWT_SECRET: "REPLACE_WITH_SUPABASE_JWT_SECRET"

  # Stripe billing (test or live). Backs dealfinder/billing.py.
  STRIPE_SECRET_KEY: "sk_test_REPLACE_ME"
  STRIPE_PRICE_PRO: "price_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_ME"

  # Live deal-source API keys (optional; a blank key just disables that source).
  RAPIDAPI_KEY: ""
  APIFY_TOKEN: ""
  FIRECRAWL_API_KEY: ""
  OPENROUTER_API_KEY: ""
  BESTBUY_API_KEY: ""
  EBAY_APP_ID: ""
  EBAY_CERT_ID: ""
  EBAY_CAMPAIGN_ID: ""
