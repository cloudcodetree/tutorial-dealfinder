apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dealfinder-app
  namespace: dealfinder
  labels:
    app.kubernetes.io/name: dealfinder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dealfinder-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale out when average CPU across pods passes 70% of the request.
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
