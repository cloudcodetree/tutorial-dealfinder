apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dealfinder

# Note: secret.example.yaml is intentionally NOT listed here — it's a template.
# Manage the real Secret out-of-band (copy to secret.yaml and `kubectl apply` it,
# or generate it via a secrets manager). See README.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: dealfinder
  app.kubernetes.io/part-of: dealfinder
