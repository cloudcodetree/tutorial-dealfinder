name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Correctness first: style used to run ahead of the tests, so a lint failure
      # skipped pytest entirely and a real breakage (the mcp 2.x rename) sat hidden
      # behind red CI for weeks. Tests and the eval gate now always report.
      - run: pytest -q
      - run: python -m dealfinder.run_evals   # quality gate — fails the build on regression
      - run: ruff check .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "build the Docker image and push to your registry / PaaS here"
