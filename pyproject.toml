[project]
name = "dealfinder"
version = "0.1.0"
description = "Companion code for the DealFinder AI-engineering tutorial series."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "selectolax>=0.3", "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "fastembed>=0.3", "mcp>=1.2", "fastapi>=0.110", "uvicorn>=0.30", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]
# The Part-17 PyTorch training loop. Heavy CPU wheel, kept optional so the core
# install stays light; `pip install .[torch]` (or `pip install torch`) enables it.
torch = ["torch>=2.2"]
# The Part-18 experiment tracking + model registry. Heavy (Flask/SQLAlchemy/etc),
# kept optional so the core install stays light; `pip install .[mlflow]` enables it.
mlflow = ["mlflow>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dealfinder"]

[tool.setuptools.package-data]
dealfinder = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
