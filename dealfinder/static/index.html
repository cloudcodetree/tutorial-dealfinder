<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DealFinder</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#283041; --accent:#0ea5e9; --green:#3fb950; --mut:#8b98a8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#e6edf3; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:28px 20px 8px; text-align:center; }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  .wrap { max-width:880px; margin:0 auto; padding:16px 20px 60px; }
  form { display:flex; gap:8px; margin:18px 0 6px; }
  input { flex:1; padding:13px 15px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:#fff; font-size:15px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:13px 20px; border:0; border-radius:10px; background:var(--accent); color:#04222e; font-weight:700; cursor:pointer; font-size:15px; }
  button:disabled { opacity:.6; cursor:wait; }
  .meta { color:var(--mut); font-size:12px; font-family:ui-monospace,Menlo,monospace; min-height:18px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px; display:flex; gap:12px; text-decoration:none; color:inherit; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .thumb { width:54px; height:54px; border-radius:8px; object-fit:cover; background:#0b0f14; flex:0 0 auto; }
  .title { font-weight:600; font-size:13.5px; line-height:1.35; }
  .row { display:flex; align-items:baseline; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .price { font-weight:800; font-size:16px; }
  .src { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--mut); border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  .deal { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--green); font-weight:700; }
  .vbadge { font-family:ui-monospace,Menlo,monospace; font-size:10px; font-weight:700; border:1px solid; border-radius:5px; padding:1px 7px; }
  .sub { font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700; }
  .empty { color:var(--mut); text-align:center; padding:40px 0; }
  .note { font-size:12px; color:var(--mut); text-align:center; margin-top:22px; line-height:1.6; }
  code { background:#0b0f14; padding:1px 5px; border-radius:4px; color:#cdd7e2; }
</style>
</head>
<body>
  <header>
    <h1>Deal<span>Finder</span></h1>
    <div class="sub">search an item · aggregate live offers · ranked by value</div>
  </header>
  <div class="wrap">
    <form id="f">
      <input id="q" placeholder="Try: wireless headphones, 4k monitor, the dark tower…" autocomplete="off" />
      <button id="go" type="submit">Search</button>
    </form>
    <div style="display:flex;gap:16px;margin:2px 2px 8px;font-size:13px;color:var(--mut);font-family:ui-monospace,Menlo,monospace">
      <label><input type="radio" name="mode" value="live" checked> live deals</label>
      <label><input type="radio" name="mode" value="meaning"> by meaning (saved)</label>
      <label><input type="radio" name="mode" value="ask"> ask (agent)</label>
      <label><input type="radio" name="mode" value="window"> window (context)</label>
      <label><input type="radio" name="mode" value="review"> review (multi-agent)</label>
      <label><input type="radio" name="mode" value="dataset"> dataset (ML)</label>
      <label><input type="radio" name="mode" value="pipeline"> pipeline (ML)</label>
      <label><input type="radio" name="mode" value="models"> models (ML)</label>
      <label><input type="radio" name="mode" value="tracking"> tracking (ML)</label>
      <label><input type="radio" name="mode" value="evals"> evals (ML)</label>
      <label><input type="radio" name="mode" value="mlops"> mlops (ML)</label>
      <label><input type="radio" name="mode" value="safety"> safety (sec)</label>
      <label><input type="radio" name="mode" value="inference"> inference (perf)</label>
      <label><input type="radio" name="mode" value="ops"> ops (cost)</label>
      <label><input type="radio" name="mode" value="auth"> auth (SaaS)</label>
    </div>
    <div id="trapRow" style="display:none;margin:0 2px 8px;font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,monospace">
      <label><input type="checkbox" id="trap"> inject a writer fooled by the $46 Bose trap (watch the reviewer catch it)</label>
    </div>
    <div class="meta" id="meta"></div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note"></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => "$" + Number(n).toFixed(2);
// External listing data is untrusted — escape all text and allow only http(s) URLs.
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => { try { const x = new URL(u, location.origin); return (x.protocol === "http:" || x.protocol === "https:") ? x.href : ""; } catch { return ""; } };

const mode = () => (document.querySelector('input[name=mode]:checked') || {}).value || "live";

const VERDICT = {
  deal:       ["#3fb950", "DEAL"],
  fair:       ["#58a6ff", "FAIR"],
  suspicious: ["#f0a30a", "SUSPICIOUS"],
  overpriced: ["#8b98a8", "OVERPRICED"],
};

function card(p) {
  const href = safeUrl(p.url), img = safeUrl(p.image_url);
  let vbadge = "", sub = "";
  if (p.verdict && VERDICT[p.verdict]) {
    // Two-signal deal verdict (snapshot/meaning path): badge + honest sub-line.
    const [c, label] = VERDICT[p.verdict];
    const pct = Number(p.pct_under_median) || 0;
    vbadge = `<span class="vbadge" style="color:${c};border-color:${c}66;background:${c}22">${label}</span>`;
    if (p.verdict === "deal")            sub = `<span class="sub" style="color:#3fb950">▼ ${esc(pct)}% under median</span>`;
    else if (p.verdict === "suspicious") sub = `<span class="sub" style="color:#f0a30a">⚠ looks ${esc(pct)}% under — but flagged</span>`;
    else if (p.verdict === "overpriced") sub = `<span class="sub" style="color:#8b98a8">▲ ${esc(Math.abs(pct))}% over median</span>`;
    else                                 sub = `<span class="sub" style="color:#58a6ff">≈ near median</span>`;
  } else {
    // Live-search / pgvector path: percent-under-median or match score.
    const dealPct = Number(p.deal_pct) || 0;
    const sim = p.similarity != null ? Math.round(Number(p.similarity) * 100) : null;
    sub = dealPct > 0 ? `<span class="deal">▼ ${esc(dealPct)}% under median</span>`
        : sim != null ? `<span class="deal">◎ ${esc(sim)}% match</span>` : ``;
  }
  return `
    <a class="card" href="${href || '#'}" target="_blank" rel="noopener noreferrer">
      ${img ? `<img class="thumb" src="${esc(img)}" alt="">` : `<div class="thumb"></div>`}
      <div style="min-width:0">
        ${vbadge ? `<div class="row" style="margin:0 0 4px">${vbadge}</div>` : ``}
        <div class="title">${esc(p.title)}</div>
        <div class="row"><span class="price">${esc(fmt(p.price))}</span>${sub}</div>
        <div class="row"><span class="src">${esc(p.source)}</span></div>
      </div>
    </a>`;
}

// Render the agent's natural-language answer (from /ask_agentic). The answer is
// model-generated markdown-ish text; escape it, then lift **bold** and line breaks.
function answerPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${label}</span>`;
  const body = esc(d.answer || "")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
  // Two independent, honest signals: which policy answered, and whether the
  // faithfulness guard (Part 14) verified the answer against the retrieved text.
  const policy = chip(d.used_llm ? "#58a6ff" : "#8b98a8", d.used_llm ? "LLM POLICY" : "DETERMINISTIC");
  const faith  = chip(d.grounded ? "#3fb950" : "#f0a30a", d.grounded ? "✓ FAITHFULNESS PASSED" : "⚠ FAITHFULNESS FLAGGED");
  // Agentic-RAG trajectory (Part 15): each hop re-queries when the evidence is
  // too thin. Showing the reformulated queries makes the "agentic" loop visible.
  let trace = "";
  if ((d.hops || []).length > 1) {
    const rows = d.hops.map((h, i) => {
      const mark = h.sufficient
        ? `<span style="color:#3fb950">✓ sufficient — answering</span>`
        : `<span style="color:#f0a30a">↻ ${esc(h.reason)} — re-querying</span>`;
      return `<div style="padding:6px 0;border-top:${i ? "1px solid #1c2431" : "none"}">
        <div><span style="color:#8b98a8">hop ${i + 1}:</span> <span style="color:#79c0ff">${esc(h.query)}</span></div>
        <div style="font-size:11px;padding-left:38px">${mark}</div>
      </div>`;
    }).join("");
    trace = `<details style="margin-top:12px;border-top:1px solid #222a35;padding-top:10px">
      <summary style="cursor:pointer;color:#8b98a8;font-size:12px">retrieval trajectory · ${d.hops.length} hops (the agent re-queried until the evidence was strong enough)</summary>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:8px">${rows}</div>
    </details>`;
  }
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;line-height:1.7;max-width:760px">
    <div class="row" style="margin:0 0 10px">${policy} ${faith}</div>
    <div style="color:#e6edf3">${body}</div>
    ${trace}
  </div>`;
}

// Render the context window (Part 16): show the token budget being packed —
// what fit, what got evicted, and where the survivors landed. The "context as
// RAM" move made visible on real bge token math.
function contextPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const pct = Math.min(100, Math.round((d.packed_tokens / d.budget) * 100));
  // The k-block overflow: how many budgets the full retrieved block would need.
  const over = Math.round((d.block_tokens / d.budget) * 100);
  const posBadge = (p) => p === "middle"
    ? `<span class="src" style="opacity:.6">middle · buried</span>`
    : `<span class="src" style="color:#3fb950;border-color:#3fb95066">${p} · edge</span>`;
  const line = (it, kept) => {
    const [c, label] = VERDICT[it.verdict] || ["#8b98a8", it.verdict];
    return `<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid #1c2431;${kept ? "" : "opacity:.5"}">
      <span class="price" style="font-size:14px;min-width:74px">${esc(fmt(it.price))}</span>
      <span style="flex:1;min-width:0">${esc(it.title)}</span>
      ${chip(c, label)}
      ${kept ? posBadge(it.pos) : `<span class="src">evicted</span>`}
    </div>`;
  };
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:820px">
    <div class="row" style="margin:0 0 12px;gap:10px">
      ${chip("#58a6ff", `budget ${d.budget} tok`)}
      ${chip("#8b98a8", `system prompt ${d.system_prompt_tokens} tok`)}
      ${chip("#3fb950", `kept ${d.kept}`)}
      ${chip("#f0a30a", `evicted ${d.evicted}`)}
    </div>
    <div style="font-size:12px;color:#8b98a8;font-family:ui-monospace,Menlo,monospace;margin-bottom:6px">
      retrieved ${esc(d.retrieved)} listings = <b style="color:#e6edf3">${esc(d.block_tokens)}</b> tokens
      (${esc(over)}% of budget) → packed to <b style="color:#3fb950">${esc(d.packed_tokens)}</b> / ${esc(d.budget)}
    </div>
    <div style="height:10px;border-radius:6px;background:#0b0f14;border:1px solid var(--line);overflow:hidden;margin-bottom:16px">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#3fb950,#0ea5e9)"></div>
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">In the window · ordered for "lost in the middle"</div>
    ${d.included.map(it => line(it, true)).join("")}
    <details style="margin-top:14px">
      <summary style="cursor:pointer;color:#8b98a8;font-size:12px">${esc(d.evicted)} evicted before they reached the model (the low-ranked tail)</summary>
      <div style="margin-top:6px">${d.dropped.map(it => line(it, false)).join("")}</div>
    </details>
  </div>`;
}

// Render the multi-agent writer/reviewer trail (Part 17): the writer's draft, the
// isolated reviewer's adversarial verdict (with per-check pass/fail), and — when a
// draft is rejected — the revised, guaranteed-grounded answer.
function reviewPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const md = (s) => esc(s || "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  const CHECK = { grounded: "grounded", lead_is_a_deal: "lead is a DEAL", trap_warned: "trap warned" };
  const checkRow = (checks) => Object.entries(checks).map(([k, v]) =>
    `<span class="src" style="color:${v ? "#3fb950" : "#f0a30a"};border-color:${(v ? "#3fb950" : "#f0a30a")}66">${v ? "✓" : "✗"} ${esc(CHECK[k] || k)}</span>`
  ).join(" ");
  const rv = d.draft_review, fr = d.final_review;
  const verdict = (r) => r.approved ? chip("#3fb950", "✓ REVIEWER APPROVED") : chip("#f0a30a", "✗ REVIEWER REJECTED");
  const issues = (r) => (r.issues || []).length
    ? `<ul style="margin:8px 0 0;padding-left:18px;color:#f0a30a;font-size:13px">${r.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
  // The writer's draft + the reviewer's verdict on it.
  let html = `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:820px">
    <div class="row" style="margin:0 0 8px;gap:8px">
      ${chip("#58a6ff", "WRITER DRAFT")} ${chip(d.draft.used_llm ? "#58a6ff" : "#8b98a8", d.draft.used_llm ? "LLM" : "DETERMINISTIC")}
    </div>
    <div style="color:#e6edf3;line-height:1.6">${md(d.draft.answer)}</div>
    <div class="row" style="margin:12px 0 6px;gap:8px">${verdict(rv)}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap">${checkRow(rv.checks)}</div>
    ${issues(rv)}`;
  // If the draft was rejected, show the revision arrow + the final grounded answer.
  if (d.revised) {
    html += `<div style="margin:16px 0 8px;color:#8b98a8;font-family:ui-monospace,Menlo,monospace;font-size:12px">↻ draft rejected — orchestrator revised to the guaranteed-grounded deterministic answer</div>
      <div style="border-top:1px solid #222a35;padding-top:12px">
        <div class="row" style="margin:0 0 8px;gap:8px">${chip("#3fb950", "REVISED FINAL")} ${verdict(fr)}</div>
        <div style="color:#e6edf3;line-height:1.6">${md(d.final)}</div>
        <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">${checkRow(fr.checks)}</div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

// Render the labeled training set (Part 19): label distribution, class imbalance +
// balanced weights, and the leakage-safe grouped split. Query-independent — the
// training set is fixed; this is the ML inspector, not a search.
function datasetPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const COLOR = { deal:"#3fb950", fair:"#58a6ff", suspicious:"#f0a30a", overpriced:"#8b98a8" };
  const max = Math.max(...Object.values(d.counts));
  const bar = (lab) => {
    const c = d.counts[lab], pct = Math.round((d.fractions[lab]) * 1000) / 10, w = d.class_weights[lab];
    const rarest = lab === "suspicious";
    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0">
      <span style="width:92px;color:${COLOR[lab]};font-weight:600">${esc(lab)}</span>
      <div style="flex:1;background:#0b0f14;border-radius:5px;overflow:hidden;height:20px;border:1px solid var(--line)">
        <div style="height:100%;width:${(c/max*100).toFixed(0)}%;background:${COLOR[lab]}55;border-right:2px solid ${COLOR[lab]}"></div>
      </div>
      <span style="width:120px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(c)} · ${esc(pct)}%</span>
      <span style="width:150px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:${rarest ? "#f0a30a" : "var(--mut)"}">weight ${esc(w)}${rarest ? " ← largest" : ""}</span>
    </div>`;
  };
  const split = d.split;
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:860px">
    <div class="row" style="margin:0 0 12px;gap:8px">
      ${chip("#58a6ff", `${d.n_rows} labeled rows`)}
      ${chip("#8b98a8", `${d.n_queries} queries`)}
      ${chip("#8b98a8", `${d.n_features} features`)}
      ${chip("#f0a30a", `majority ${d.majority_class} ${Math.round(d.majority_fraction*1000)/10}%`)}
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Label distribution · balanced class weights (n / n_classes·count)</div>
    ${["deal","fair","suspicious","overpriced"].map(bar).join("")}
    <div style="font-size:12px;color:#8b98a8;margin-top:8px">A classifier that always shouts <b style="color:#e6edf3">${esc(d.majority_class)}</b> scores ${Math.round(d.majority_fraction*1000)/10}% for free — that's the baseline to beat. The rarest class (suspicious) gets the largest weight so the model can't ignore it. No resampling.</div>
    <div style="border-top:1px solid #222a35;margin-top:14px;padding-top:12px">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Leakage-safe grouped split (seed 0) · whole queries to one side</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px">
        ${chip("#3fb950", `train: ${split.train_queries.length} queries · ${split.train_rows} rows`)}
        ${chip("#58a6ff", `test: ${split.test_queries.length} queries · ${split.test_rows} rows`)}
        ${chip(split.disjoint ? "#3fb950" : "#f0a30a", split.disjoint ? "✓ disjoint — no query straddles the split" : "✗ leak")}
      </div>
      <div style="font-size:11px;color:var(--mut);margin-top:8px">test queries: ${split.test_queries.map(esc).join(" · ")}</div>
    </div>
  </div>`;
}

// Render the orchestration flow (Part 20): the 5-stage DAG, the data-contract gate,
// and the dbt-style good_deals output — made visible on a real run.
function pipelinePanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const stage = (s, i, last) => `
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
      <span style="width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;background:${s.ok ? "#3fb95022" : "#f0a30a22"};border:1px solid ${s.ok ? "#3fb950" : "#f0a30a"};color:${s.ok ? "#3fb950" : "#f0a30a"}">${s.ok ? "✓" : "✗"}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:#e6edf3">${esc(s.name)}</div>
        <div style="font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,monospace">${esc(s.detail)}</div>
      </div>
      ${!last ? `<span style="color:#8b98a8">↓</span>` : ``}
    </div>`;
  const c = d.contract;
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:820px">
    <div class="row" style="margin:0 0 12px;gap:8px">
      ${chip("#58a6ff", d.has_prefect ? "engine: Prefect 3.7.7" : "engine: plain fallback")}
      ${chip(c.passed ? "#3fb950" : "#f0a30a", c.passed ? `✓ contract ${c.valid}/${c.total}` : `✗ contract ${c.valid}/${c.total}`)}
      ${chip("#3fb950", `${d.good_deals} good deals`)}
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">5-stage DAG · one direction · gate hard-stops on a bad row</div>
    <div>${d.stages.map((s,i)=>stage(s,i,i===d.stages.length-1)).join("")}</div>
    <div style="font-size:12px;color:#8b98a8;margin-top:8px;border-top:1px solid #222a35;padding-top:10px">
      The <b style="color:#e6edf3">quality-gate</b> is a Pydantic data contract (price > 0, category in the known 11): it
      <b style="color:#e6edf3">${esc(c.valid)}/${esc(c.total)}</b> rows valid — a single bad row raises <code>DataContractError</code>
      and the flow fails before any expensive downstream work. The final <b style="color:#e6edf3">good_deals</b> view keeps the
      ${esc(d.good_deals)} listings 10–90% under their same-query median (the naive median signal — Part 21 adds the residual guard).
    </div>
  </div>`;
}

// Render the Part 21 model comparison: MAE bars for linear vs GBDT+embeddings on
// the full corpus, the boosting-alone failure, the audio subset, and the PyTorch MLP.
function modelsPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const maxMae = Math.max(d.full.linear_mae, d.full.gbdt_mae, d.hand_only.gbdt_mae, d.torch_mlp.mae);
  const barRow = (label, mae, color, note) => `

// Render the MLflow experiment ledger (Part 22): every run's MAE/R², selectable vs
// documented-baseline, and the registered winner marked — the ledger, not just the winner.
function trackingPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;

    return `<div class="card" style="grid-column:1 / -1;padding:18px 22px">MLflow isn't installed in this environment — <code>pip install ".[mlflow]"</code> to run the experiment ledger.</div>`;
  }
  const maxMae = Math.max(...d.runs.map(r => r.mae));
  const row = (r) => {
    const win = r.name === d.winner;
    const base = !r.selectable;
    const color = win ? "#3fb950" : base ? "#8b98a8" : "#58a6ff";
    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;${base ? "opacity:.65" : ""}">
      <span style="width:20px;text-align:center;color:#3fb950;font-weight:700">${win ? "★" : ""}</span>
      <span style="width:130px;color:${color};font-weight:${win ? "700" : "600"}">${esc(r.name)}</span>
      <div style="flex:1;background:#0b0f14;border-radius:5px;overflow:hidden;height:18px;border:1px solid var(--line)">

      </div>
      <span style="width:80px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700">$${esc(r.mae)}</span>
      <span style="width:64px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut)">R² ${r.r2 != null ? esc(r.r2) : "n/a"}</span>
      <span style="width:150px;text-align:right">${base ? chip("#8b98a8","documented-baseline") : chip("#58a6ff","fair-price")}</span>
    </div>`;
  };
  // selectable first (the fair comparison), then documented baselines.
  const ordered = [...d.runs.filter(r=>r.selectable), ...d.runs.filter(r=>!r.selectable)];
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:880px">
    <div class="row" style="margin:0 0 12px;gap:8px">
      ${chip("#58a6ff", "experiment: " + esc(d.experiment))}
      ${chip("#3fb950", "★ winner: " + esc(d.winner) + " $" + esc(d.winner_mae))}
      ${chip("#8b98a8", "registered: " + esc(d.registered_model))}
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Run ledger · lower MAE is better · ★ = registered winner</div>

    <div style="font-size:12px;color:#8b98a8;margin-top:10px;border-top:1px solid #222a35;padding-top:10px">
      The winner is picked <b style="color:#e6edf3">only</b> from the fair-price runs — all trained on identical hand+emb16 features. The <b style="color:#8b98a8">documented baselines</b> (linear $227.89, torch $117.11) are logged so the Part 21 numbers reproduce, but excluded from selection: torch's $117.11 is lower, but on cheaper hand-only features — not the same experiment. On equal footing, <b style="color:#3fb950">gbdt wins at $${esc(d.winner_mae)}</b>.
    </div>
  </div>`;
}

// Render the eval gate (Part 23): precision@5 on the 20-item golden set for both
// rankers, side by side — the two-signal ranker clears the 0.80 gate, the naive
// median-only baseline is fooled by cheap-for-the-wrong-reason traps and fails.
function evalsPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const LABEL = { deal:"#3fb950", fair:"#58a6ff", suspicious:"#f0a30a", overpriced:"#8b98a8" };
  const col = (name, r) => {
    const pass = r.passes;
    const c = pass ? "#3fb950" : "#f0a30a";
    const rows = r.top5.map((t,i) => `
      <div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12.5px">
        <span style="width:16px;color:var(--mut)">${i+1}</span>
        <span class="src" style="color:${LABEL[t.label]};border-color:${LABEL[t.label]}66;min-width:78px;text-align:center">${esc(t.label)}</span>
        <span style="flex:1;min-width:0;color:#e6edf3">${esc(t.title)}</span>
      </div>`).join("");
    return `<div style="flex:1;min-width:300px">
      <div class="row" style="margin:0 0 6px;gap:8px">
        <b style="color:#e6edf3">${esc(name)}</b>
        ${chip(c, "p@5 " + r.precision_at_5.toFixed(2))}

  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:900px">
    <div class="row" style="margin:0 0 12px;gap:8px">
      ${chip("#8b98a8", d.n + " golden items")}
      ${chip("#58a6ff", "gate: precision@" + d.k + " ≥ " + d.gate)}
      ${chip("#3fb950", "A/B winner: " + d.ab.winner + " +" + d.ab.delta)}
    </div>
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      ${col("two_signal", d.two_signal)}
      ${col("median_only", d.median_only)}
    </div>
    <div style="font-size:12px;color:#8b98a8;margin-top:12px;border-top:1px solid #222a35;padding-top:10px">
      Same 20 hand-labeled listings, two rankers. The <b style="color:#3fb950">two-signal</b> ranker's top-5 are all real <b style="color:#3fb950">deals</b> (p@5 = 1.00). The naive <b style="color:#f0a30a">median-only</b> baseline is fooled — a $10.75 Kindle and a $15 Galaxy Tab read as huge discounts, so its top-5 is mostly <b style="color:#f0a30a">suspicious</b> traps (p@5 = 0.40, below the 0.80 gate). That +0.60 is a number you put in a PR, wired into CI so a regression can't merge.
    </div>
  </div>`;
}

// Render the MLOps loop (Part 24): the four stations — drift, retrain, eval gate,
// promote — as one auditable cycle, with each station's real result + the decision.
function mlopsPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  const station = (i, name, ok, detail, last) => `
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0">
      <span style="width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;background:${ok?"#3fb95022":"#f0a30a22"};border:1px solid ${ok?"#3fb950":"#f0a30a"};color:${ok?"#3fb950":"#f0a30a"}">${ok?"✓":"✗"}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:#e6edf3">${esc(name)}</div>
        <div style="font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,monospace">${detail}</div>
      </div>
      ${!last ? `<span style="color:#8b98a8">↓</span>` : ``}
    </div>`;
  const dr = d.drift, rt = d.retrain, gt = d.gate;
  const promoteColor = d.promote ? "#3fb950" : "#f0a30a";
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:840px">
    <div class="row" style="margin:0 0 12px;gap:8px">
      ${chip("#f0a30a", `PSI ${dr.psi} ≥ ${dr.threshold} → DRIFT`)}
      ${chip("#58a6ff", `gate ≥ ${gt.threshold}`)}
      ${chip(promoteColor, d.promote ? "★ PROMOTED" : "✗ NOT PROMOTED")}
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Four stations · one auditable cycle · fires on evidence</div>
    ${station(1, "drift detection (PSI)", dr.drifted, `PSI ${dr.psi} vs threshold ${dr.threshold} → ${dr.drifted?"DRIFT — retrain":"hold"}`, false)}
    ${station(2, "deterministic retrain", d.retrained, rt ? `GBDT MAE $${rt.gbdt_mae} vs linear $${rt.linear_mae} (${rt.improvement_pct}% better) · ${rt.n_train}/${rt.n_test} split` : "skipped (no drift)", false)}
    ${station(3, "eval gate (precision@5)", gt.passes, `${gt.challenger}: p@5 ${gt.precision_at_5.toFixed(2)} vs ${gt.threshold} → ${gt.passes?"PASS":"FAIL"}`, false)}
    ${station(4, "champion / challenger promote", d.promote, `challenger ${gt.precision_at_5.toFixed(2)} vs champion ${d.champion} ${d.champion_precision_at_5.toFixed(2)} → ${d.promote?"promote":"hold champion"}`, true)}
    <div style="font-size:12.5px;color:#e6edf3;margin-top:10px;border-top:1px solid #222a35;padding-top:10px">
      <b style="color:${promoteColor}">${esc(d.reason)}</b>
    </div>
    <div style="font-size:11px;color:#8b98a8;margin-top:8px">
      Promotion needs <b style="color:#e6edf3">both</b>: pass the 0.80 gate <i>and</i> strictly beat the champion. Every decision — PSI, MAE, precision@5, the reason — is recorded in the returned trace, not a log line. That's the artifact you audit.
    </div>
  </div>`;
}

    ${layer("4 · append-only audit log",

// Render the ops utilities (Part 30): FinOps cost attribution per model, the budget
// alert thresholds, and PSI drift detection across three scenarios.
function authPanel(d) {

  const verdict = (res) => {
    const detail = res.user
      ? `${esc(res.user.role)} · ${esc(res.user.email)}`
      : esc(res.detail);
    return `<span style="color:${SC(res.status)};font-weight:700;font-family:ui-monospace,Menlo,monospace">${res.status}</span>
      <span style="color:#8b98a8">${detail}</span>`;
  };
  const row = (s) => `<div style="display:flex;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid #1a212b">
      <span style="width:190px;color:#e6edf3;font-size:13px">${esc(s.name)}</span>
      <span style="flex:1;min-width:230px">${verdict(s.result)}</span>
      <span style="color:var(--mut);font-size:12px">${esc(s.note)}</span></div>`;
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${esc(label)}</span>`;
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:900px">
    <div class="row" style="margin:0 0 8px;gap:8px">
      ${chip("#3fb950", "200 verified")} ${chip("#f85149", "401 rejected")} ${chip("#f0a30a", "403 forbidden")}
    </div>
    <div style="font-size:12px;color:#8b98a8;margin:0 0 6px">Every row is a Supabase-style HS256 token run through the real <code>auth.py</code> verifier (<b>${esc(d.algo)}</b>, aud <b>${esc(d.audience)}</b>). A throwaway demo secret is used here — never your <code>SUPABASE_JWT_SECRET</code>.</div>
    ${d.scenarios.map(row).join("")}
    <div style="font-size:12px;color:#8b98a8;margin-top:10px;border-top:1px solid #222a35;padding-top:10px">Two valid tokens resolve to a <b>User</b> with the plan read from <code>app_metadata</code>. Every bad token — expired, tampered, wrong secret, no subject — is a <b style="color:#f85149">401</b> ("we don't know who you are"). A valid free-tier token hitting a pro route is a <b style="color:#f0a30a">403</b> ("we know you, you lack the role"). Verify locally, no network round-trip.</div>
  </div>`;
}

      <span style="width:110px;color:#e6edf3;font-size:13px">${esc(model)}</span>
      <div style="flex:1;background:#0b0f14;border-radius:5px;overflow:hidden;height:18px;border:1px solid var(--line)">
        <div style="height:100%;width:${(cost/maxCost*100).toFixed(0)}%;background:${model==='gpt-4o'?'#f0a30a':'#58a6ff'}55;border-right:2px solid ${model==='gpt-4o'?'#f0a30a':'#58a6ff'}"></div>
      </div>
      <span style="width:130px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:12px">$${esc(cost.toFixed(5))} · ${esc(pct)}%</span>
    </div>`;
  };
  const BC = { ok:"#3fb950", warn:"#f0a30a", over:"#f0a30a" };
  const budgetCell = (frac, status) => `<span class="src" style="color:${BC[status]};border-color:${BC[status]}66">${esc(Math.round(frac*100))}% → ${esc(status)}</span>`;
  const DC = (drifted) => drifted ? "#f0a30a" : "#3fb950";
  const driftRow = (name, o) => `<div style="display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:13px">
      <span style="width:78px;color:var(--mut)">${esc(name)}</span>
      <span style="width:150px;font-family:ui-monospace,Menlo,monospace">PSI ${esc(o.psi)}</span>
      <span style="color:${DC(o.drifted)};font-weight:600">${o.drifted ? "✗ DRIFT — retrain" : "✓ hold"}</span></div>`;
  return `<div class="card" style="grid-column:1 / -1;display:block;padding:18px 22px;max-width:880px">
    <div class="row" style="margin:0 0 4px;gap:8px">
      ${chip("#58a6ff", "cost attribution")} ${chip("#f0a30a", "budget alerts")} ${chip("#3fb950", "drift → retrain")}
    </div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px">FinOps · spend per model this session</div>
    ${Object.entries(c.by_model).map(([m,v])=>costRow(m,v)).join("")}
    <div style="font-size:12px;color:#8b98a8;margin-top:4px">Session total <b style="color:#e6edf3">$${esc(c.total.toFixed(5))}</b> — <b style="color:#f0a30a">gpt-4o</b> (extraction) drives ${esc(Math.round(c.by_model["gpt-4o"]/c.total*100))}% of spend. That's the actionable signal: cache it, batch it, or route simple titles to the mini model.</div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">Budget alert thresholds (vs \$1.00 budget)</div>
    <div class="row" style="gap:8px">${Object.entries(d.budget).map(([f,s])=>budgetCell(parseFloat(f),s)).join("")}</div>
    <div style="font-size:12px;color:#8b98a8;margin-top:4px"><b style="color:#f0a30a">warn</b> is the actionable window — it pages before the invoice lands; <b>over</b> means you already overran.</div>
    <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">Population stability index · query-mix drift (threshold ${esc(d.drift_threshold)})</div>
    ${["identical","tiny","big"].map(n=>driftRow(n, d.drift[n])).join("")}
    <div style="font-size:12px;color:#8b98a8;margin-top:8px;border-top:1px solid #222a35;padding-top:10px">A live system you can't see is a liability. Attribute every dollar, alert before the bill, and watch the input distribution — audio collapsing from 50% to 10% of traffic (PSI 1.08, 5× the threshold) fires a retrain before deal scores quietly rot.</div>
  </div>`;
}

async function run(q) {
  const m = mode();
  $("go").disabled = true; $("grid").innerHTML = ""; $("note").textContent = "";
  $("meta").textContent = m === "meaning" ? "searching saved deals by meaning…"
    : m === "ask" ? "the agent is reasoning — filter, then score by deal quality…"
    : m === "window" ? "packing the context window — retrieve wide, then evict to budget…"
    : m === "review" ? "writer drafts, reviewer adversarially checks, orchestrator revises if rejected…"
    : m === "dataset" ? "building the labeled training set from the frozen snapshot…"
    : m === "pipeline" ? "running the 5-stage orchestration flow…"
    : m === "models" ? "fitting linear, GBDT+embeddings, and a PyTorch MLP on the snapshot…"
    : m === "tracking" ? "running the MLflow experiment — logging five runs, selecting the winner…"
    : m === "evals" ? "running the eval gate — precision@5 on the golden set, both rankers…"
    : m === "mlops" ? "running the MLOps cycle — drift, retrain, gate, promote…"
    : m === "safety" ? "running untrusted text through every guardrail layer…"
    : m === "inference" ? "measuring the inference-optimization levers — cache, batching, GPU refs…"
    : m === "ops" ? "running the ops utilities — cost attribution, budget, drift…"
    : m === "auth" ? "verifying Supabase JWTs — valid, expired, tampered, wrong secret, role gate…"
    : "searching live sources…";
  try {
    if (m === "auth") {
      const r = await fetch("/auth");
      const d = await r.json();
      const ok = d.scenarios.filter(s => s.result.status === 200).length;
      const rejected = d.scenarios.filter(s => s.result.status === 401).length;
      const forbidden = d.scenarios.filter(s => s.result.status === 403).length;
      $("meta").textContent = `${d.algo} · ${ok} verified · ${rejected} rejected (401) · ${forbidden} forbidden (403)`;
      $("grid").innerHTML = authPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "ops") {
      const r = await fetch("/ops");
      const d = await r.json();
      $("meta").textContent = `session $${d.cost.total.toFixed(5)} · gpt-4o ${Math.round(d.cost.by_model["gpt-4o"]/d.cost.total*100)}% · big-shift PSI ${d.drift.big.psi} → DRIFT`;
      $("grid").innerHTML = opsPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "inference") {
      const r = await fetch("/inference");
      const d = await r.json();
      $("meta").textContent = `cache 0.95 ${d.cache_095.hits}/${d.cache_095.n_queries} → 0.90 ${d.cache_090.hits}/${d.cache_090.n_queries} · batching ${d.batching.speedup}× (illustrative) · 2 anchored GPU refs`;
      $("grid").innerHTML = inferencePanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "safety") {
      const r = await fetch("/safety");
      const d = await r.json();
      $("meta").textContent = `injection ${d.injection.attack.flagged ? "blocked" : "MISSED"} · PII redacted · spec ${d.spec.bad.errors.length} errors caught · ${d.tool_trust.quarantined.length} tool quarantined`;
      $("grid").innerHTML = safetyPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "mlops") {
      const r = await fetch("/mlops");
      const d = await r.json();
      $("meta").textContent = `PSI ${d.drift.psi} → ${d.drift.drifted ? "DRIFT" : "hold"} · retrain GBDT $${d.retrain ? d.retrain.gbdt_mae : "—"} · gate ${d.gate.precision_at_5.toFixed(2)} ${d.gate.passes ? "PASS" : "FAIL"} · ${d.promote ? "PROMOTED" : "held"}`;
      $("grid").innerHTML = mlopsPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "evals") {
      const r = await fetch("/evals");
      const d = await r.json();
      $("meta").textContent = `two_signal p@5 ${d.two_signal.precision_at_5.toFixed(2)} ${d.two_signal.passes ? "PASS" : "FAIL"} · median_only ${d.median_only.precision_at_5.toFixed(2)} ${d.median_only.passes ? "PASS" : "FAIL"} · gate ≥ ${d.gate}`;
      $("grid").innerHTML = evalsPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "tracking") {
      const r = await fetch("/tracking");
      const d = await r.json();
      $("meta").textContent = d.mlflow_available
        ? `${d.runs.length} runs logged · winner ★ ${d.winner} $${d.winner_mae} · registered ${d.registered_model}`
        : "mlflow not installed";
      $("grid").innerHTML = trackingPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "models") {
      const r = await fetch("/models");
      const d = await r.json();
      $("meta").textContent = `linear $${d.full.linear_mae} → GBDT+emb $${d.full.gbdt_mae} · −${d.full.improvement_pct}% MAE · R² ${d.full.linear_r2}→${d.full.gbdt_r2}`;
      $("grid").innerHTML = modelsPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "pipeline") {
      const r = await fetch("/pipeline");
      const d = await r.json();
      $("meta").textContent = `flow ran · contract ${d.contract.valid}/${d.contract.total} ${d.contract.passed ? "passed" : "FAILED"} · ${d.good_deals} good deals · engine ${d.has_prefect ? "Prefect 3.7.7" : "plain"}`;
      $("grid").innerHTML = pipelinePanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "dataset") {
      const r = await fetch("/dataset");
      const d = await r.json();
      $("meta").textContent = `${d.n_rows} rows · ${d.n_queries} queries · grouped split ${d.split.train_queries.length}/${d.split.test_queries.length} queries (${d.split.train_rows}/${d.split.test_rows} rows)`;
      $("grid").innerHTML = datasetPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "review") {
      const r = await fetch("/review?q=" + encodeURIComponent(q) + "&trap=" + ($("trap").checked ? "true" : "false"));
      const d = await r.json();
      $("meta").textContent = d.revised
        ? `draft rejected by the reviewer → revised (${(d.draft_review.issues || []).length} issue${d.draft_review.issues.length !== 1 ? "s" : ""})`
        : `draft approved by the reviewer — no revision needed`;
      $("grid").innerHTML = reviewPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "window") {
      const r = await fetch("/context?q=" + encodeURIComponent(q) + "&budget=256&k=20");
      const d = await r.json();
      $("meta").textContent = `${d.retrieved} retrieved → ${d.kept} kept, ${d.evicted} evicted · ${d.packed_tokens}/${d.budget} tokens`;
      $("grid").innerHTML = contextPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "ask") {
      const r = await fetch("/ask_agentic?q=" + encodeURIComponent(q));
      const d = await r.json();
      const n = (d.sources || []).length;
      const hops = (d.hops || []).length;
      $("meta").textContent = `agent answered${n ? ` · cites ${n} listing${n>1?"s":""}` : ""}${hops ? ` · ${hops} retrieval hop${hops>1?"s":""}` : ""}`;
      $("grid").innerHTML = answerPanel(d);
      $("go").disabled = false;
      return;
    }
    if (m === "meaning") {
      const r = await fetch("/semantic?q=" + encodeURIComponent(q));
      if (r.status === 503) { $("meta").textContent = "meaning search needs a database (set DATABASE_URL)"; $("go").disabled = false; return; }
      const d = await r.json();
      const scope = d.backend === "pgvector" ? "across all saved deals" : "across the frozen snapshot";
      $("meta").textContent = `${d.count} matches by meaning · ${scope}`;
      $("grid").innerHTML = d.results.length ? d.results.map(card).join("") : `<div class="empty">No results.</div>`;
      $("go").disabled = false;
      return;
    }
    // live: stream offers over Server-Sent Events — cards paint as each source lands,
    // instead of blocking until the slowest one finishes (Part 18).
    let n = 0; const srcs = [];
    const es = new EventSource("/search/stream?q=" + encodeURIComponent(q));
    es.addEventListener("results", (e) => {
      const d = JSON.parse(e.data);
      if (d.source && !srcs.includes(d.source)) srcs.push(d.source);
      (d.results || []).forEach(p => { $("grid").insertAdjacentHTML("beforeend", card(p)); n++; });
      $("meta").textContent = `streaming… ${n} offers · sources: ${srcs.join(", ")}`;
    });
    es.addEventListener("source_error", (e) => {
      const d = JSON.parse(e.data); if (d.source && !srcs.includes(d.source)) srcs.push(d.source + "✗");
    });
    es.addEventListener("done", (e) => {
      const d = JSON.parse(e.data);
      $("meta").textContent = `${n} offers streamed · sources: ${srcs.join(", ") || "none"} · median ${fmt(d.median_price)}`;
      if (!n) $("grid").innerHTML = `<div class="empty">No results.</div>`;
      es.close(); $("go").disabled = false;
    });
    // EventSource fires 'error' when the server closes the stream after 'done';
    // closing here prevents the browser's automatic reconnect (which would re-search).
    es.addEventListener("error", () => { es.close(); $("go").disabled = false; });
    return;
  } catch (e) {
    $("meta").textContent = "search failed: " + e;
    $("go").disabled = false;
  }
}

fetch("/sources").then(r=>r.json()).then(s => {
  const on = Object.entries(s).filter(([,v])=>v).map(([k])=>k);
  const paid = ["Amazon", "Apify", "Firecrawl"];  // metered — off unless opted in
  $("note").innerHTML =
    `Running free-tier sources: <b>${esc(on.join(", ") || "none")}</b>. ` +
    `Metered sources (${paid.join(", ")}) are off by design — set ` +
    `<code>DEALFINDER_ENABLE_PAID_SOURCES=1</code> to opt in (they cost credits).`;
});

// The trap toggle is only meaningful in multi-agent review mode.
document.querySelectorAll('input[name=mode]').forEach(r =>
  r.addEventListener("change", () => { $("trapRow").style.display = mode() === "review" ? "block" : "none"; }));

// dataset (ML) mode is query-independent — run it on submit even with an empty box.
$("f").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q || ["dataset","pipeline","models","tracking","evals","mlops","safety","inference","ops","auth"].includes(mode())) run(q); });
</script>
</body>
</html>
