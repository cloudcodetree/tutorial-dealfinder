<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DealFinder</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#283041; --accent:#0ea5e9; --green:#3fb950; --mut:#8b98a8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#e6edf3; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:28px 20px 8px; text-align:center; }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  .wrap { max-width:880px; margin:0 auto; padding:16px 20px 60px; }
  form { display:flex; gap:8px; margin:18px 0 6px; }
  input { flex:1; padding:13px 15px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:#fff; font-size:15px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:13px 20px; border:0; border-radius:10px; background:var(--accent); color:#04222e; font-weight:700; cursor:pointer; font-size:15px; }
  button:disabled { opacity:.6; cursor:wait; }
  .meta { color:var(--mut); font-size:12px; font-family:ui-monospace,Menlo,monospace; min-height:18px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px; display:flex; gap:12px; text-decoration:none; color:inherit; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .thumb { width:54px; height:54px; border-radius:8px; object-fit:cover; background:#0b0f14; flex:0 0 auto; }
  .title { font-weight:600; font-size:13.5px; line-height:1.35; }
  .row { display:flex; align-items:baseline; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .price { font-weight:800; font-size:16px; }
  .src { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--mut); border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  .deal { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--green); font-weight:700; }
  .vbadge { font-family:ui-monospace,Menlo,monospace; font-size:10px; font-weight:700; border:1px solid; border-radius:5px; padding:1px 7px; }
  .sub { font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700; }
  .empty { color:var(--mut); text-align:center; padding:40px 0; }
  .note { font-size:12px; color:var(--mut); text-align:center; margin-top:22px; line-height:1.6; }
  code { background:#0b0f14; padding:1px 5px; border-radius:4px; color:#cdd7e2; }
</style>
</head>
<body>
  <header>
    <h1>Deal<span>Finder</span></h1>
    <div class="sub">search an item · aggregate live offers · ranked by value</div>
  </header>
  <div class="wrap">
    <form id="f">
      <input id="q" placeholder="Try: wireless headphones, 4k monitor, the dark tower…" autocomplete="off" />
      <button id="go" type="submit">Search</button>
    </form>
    <div style="display:flex;gap:16px;margin:2px 2px 8px;font-size:13px;color:var(--mut);font-family:ui-monospace,Menlo,monospace">
      <label><input type="radio" name="mode" value="live" checked> live deals</label>
      <label><input type="radio" name="mode" value="meaning"> by meaning (saved)</label>
      <label><input type="radio" name="mode" value="ask"> ask (agent)</label>
    </div>
    <div class="meta" id="meta"></div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note"></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => "$" + Number(n).toFixed(2);
// External listing data is untrusted — escape all text and allow only http(s) URLs.
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => { try { const x = new URL(u, location.origin); return (x.protocol === "http:" || x.protocol === "https:") ? x.href : ""; } catch { return ""; } };

const mode = () => (document.querySelector('input[name=mode]:checked') || {}).value || "live";

const VERDICT = {
  deal:       ["#3fb950", "DEAL"],
  fair:       ["#58a6ff", "FAIR"],
  suspicious: ["#f0a30a", "SUSPICIOUS"],
  overpriced: ["#8b98a8", "OVERPRICED"],
};

function card(p) {
  const href = safeUrl(p.url), img = safeUrl(p.image_url);
  let vbadge = "", sub = "";
  if (p.verdict && VERDICT[p.verdict]) {
    // Two-signal deal verdict (snapshot/meaning path): badge + honest sub-line.
    const [c, label] = VERDICT[p.verdict];
    const pct = Number(p.pct_under_median) || 0;
    vbadge = `<span class="vbadge" style="color:${c};border-color:${c}66;background:${c}22">${label}</span>`;
    if (p.verdict === "deal")            sub = `<span class="sub" style="color:#3fb950">▼ ${esc(pct)}% under median</span>`;
    else if (p.verdict === "suspicious") sub = `<span class="sub" style="color:#f0a30a">⚠ looks ${esc(pct)}% under — but flagged</span>`;
    else if (p.verdict === "overpriced") sub = `<span class="sub" style="color:#8b98a8">▲ ${esc(Math.abs(pct))}% over median</span>`;
    else                                 sub = `<span class="sub" style="color:#58a6ff">≈ near median</span>`;
  } else {
    // Live-search / pgvector path: percent-under-median or match score.
    const dealPct = Number(p.deal_pct) || 0;
    const sim = p.similarity != null ? Math.round(Number(p.similarity) * 100) : null;
    sub = dealPct > 0 ? `<span class="deal">▼ ${esc(dealPct)}% under median</span>`
        : sim != null ? `<span class="deal">◎ ${esc(sim)}% match</span>` : ``;
  }
  return `
    <a class="card" href="${href || '#'}" target="_blank" rel="noopener noreferrer">
      ${img ? `<img class="thumb" src="${esc(img)}" alt="">` : `<div class="thumb"></div>`}
      <div style="min-width:0">
        ${vbadge ? `<div class="row" style="margin:0 0 4px">${vbadge}</div>` : ``}
        <div class="title">${esc(p.title)}</div>
        <div class="row"><span class="price">${esc(fmt(p.price))}</span>${sub}</div>
        <div class="row"><span class="src">${esc(p.source)}</span></div>
      </div>
    </a>`;
}

// Render the agent's natural-language answer (from /ask_agentic). The answer is
// model-generated markdown-ish text; escape it, then lift **bold** and line breaks.
function answerPanel(d) {
  const chip = (color, label) => `<span class="vbadge" style="color:${color};border-color:${color}66;background:${color}22">${label}</span>`;
  const body = esc(d.answer || "")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
  // Two independent, honest signals: which policy answered, and whether the
  // faithfulness guard (Part 14) verified the answer against the retrieved text.
  const policy = chip(d.used_llm ? "#58a6ff" : "#8b98a8", d.used_llm ? "LLM POLICY" : "DETERMINISTIC");
  const faith  = chip(d.grounded ? "#3fb950" : "#f0a30a", d.grounded ? "✓ FAITHFULNESS PASSED" : "⚠ FAITHFULNESS FLAGGED");
  return `<div class="card" style="display:block;padding:18px 20px;line-height:1.7">
    <div class="row" style="margin:0 0 10px">${policy} ${faith}</div>
    <div style="color:#e6edf3">${body}</div>
  </div>`;
}

async function run(q) {
  const m = mode();
  $("go").disabled = true; $("grid").innerHTML = ""; $("note").textContent = "";
  $("meta").textContent = m === "meaning" ? "searching saved deals by meaning…"
    : m === "ask" ? "the agent is reasoning — filter, then score by deal quality…"
    : "searching live sources…";
  try {
    if (m === "ask") {
      const r = await fetch("/ask_agentic?q=" + encodeURIComponent(q));
      const d = await r.json();
      const n = (d.sources || []).length;
      const hops = (d.hops || []).length;
      $("meta").textContent = `agent answered${n ? ` · cites ${n} listing${n>1?"s":""}` : ""}${hops ? ` · ${hops} retrieval hop${hops>1?"s":""}` : ""}`;
      $("grid").innerHTML = answerPanel(d);
      $("go").disabled = false;
      return;
    }
    const r = await fetch((m === "meaning" ? "/semantic?q=" : "/search?q=") + encodeURIComponent(q));
    if (r.status === 503) { $("meta").textContent = "meaning search needs a database (set DATABASE_URL)"; $("go").disabled = false; return; }
    const d = await r.json();
    if (m === "meaning") {
      const scope = d.backend === "pgvector" ? "across all saved deals" : "across the frozen snapshot";
      $("meta").textContent = `${d.count} matches by meaning · ${scope}`;
    } else {
      const live = (d.sources_live || []).join(", ") || "none";
      $("meta").textContent = `${d.count} offers · sources live: ${live} · median ${fmt(d.median_price)}`;
    }
    $("grid").innerHTML = d.results.length
      ? d.results.map(card).join("")
      : `<div class="empty">No results.</div>`;
  } catch (e) {
    $("meta").textContent = "search failed: " + e;
  }
  $("go").disabled = false;
}

fetch("/sources").then(r=>r.json()).then(s => {
  const off = Object.entries(s).filter(([,v])=>!v).map(([k])=>k);
  if (off.length) $("note").innerHTML =
    `Live now via keyless sources. To add real retail deals, set <code>RAPIDAPI_KEY</code> or <code>APIFY_TOKEN</code> and restart — currently off: ${esc(off.join(", "))}.`;
});

$("f").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) run(q); });
</script>
</body>
</html>
